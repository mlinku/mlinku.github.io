<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>配色并排对比 · 关西秋日手帖</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: #eef0f4; color: #1f2329;
    display: flex; flex-direction: column; min-height: 100dvh;
  }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid #e2e5ec;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
  }
  .topbar-inner {
    max-width: 860px; margin: 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
  .swatches { display: inline-flex; gap: 4px; }
  .swatches i { width: 8px; height: 8px; border-radius: 50%; display: block; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .tabs, .modes { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .btn {
    border: 1px solid #dce0e8; background: #fff; color: #3c4350;
    padding: 5px 11px; border-radius: 999px; font: 600 12.5px/1.3 inherit; cursor: pointer;
    transition: all .16s ease; white-space: nowrap;
  }
  .btn.on { background: #1e2229; border-color: #1e2229; color: #fff; }
  .btn.old.on { background: #3a7040; border-color: #3a7040; color: #fff; }
  .btn.new.on { background: #2f669e; border-color: #2f669e; color: #fff; }
  .mobile-only { display: none; }

  .stage {
    flex: 1; display: grid;
    grid-template-columns: repeat(2, 390px);
    justify-content: center; align-content: start;
    gap: 28px; padding: 18px 16px 32px;
  }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
  .label {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 700; color: #333a45; white-space: nowrap;
  }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .tag.old { background: #e9f3d6; color: #3a7040; }
  .tag.new { background: #eef5fc; color: #2f669e; }
  .phone {
    width: 390px; height: 780px; border-radius: 28px; overflow: hidden;
    background: #fff; border: 6px solid #1e2229;
    box-shadow: 0 20px 50px -18px rgba(20,30,50,.26);
  }
  .phone iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* Mobile layout: full-screen single-frame toggle by default, plus optional side-by-side split! */
  @media (max-width: 840px) {
    .mobile-only { display: inline-flex; }
    .topbar { padding: calc(8px + env(safe-area-inset-top, 0px)) 10px 8px; }
    .topbar-inner { gap: 6px; }
    .brand { font-size: 13.5px; }
    .btn { padding: 5px 9px; font-size: 12px; }

    .stage {
      display: block; padding: 0; flex: 1; position: relative;
    }
    .col { width: 100%; height: 100%; gap: 0; }
    .col .label { display: none; }
    .phone {
      width: 100%; height: calc(100dvh - 86px); border: 0; border-radius: 0; box-shadow: none;
    }
    body[data-mobile="old"] .col.new { display: none; }
    body[data-mobile="new"] .col.old { display: none; }

    /* Side-by-side comparison mode on mobile */
    body[data-mobile="split"] .stage {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px 6px 14px;
    }
    body[data-mobile="split"] .col { display: flex; gap: 6px; }
    body[data-mobile="split"] .col .label { display: inline-flex; font-size: 11px; gap: 4px; }
    body[data-mobile="split"] .col .label .desc { display: none; }
    body[data-mobile="split"] .phone {
      width: 100%; height: calc(100dvh - 122px);
      border: 2px solid #2b313d; border-radius: 14px; overflow: hidden;
      position: relative;
    }
    body[data-mobile="split"] .phone iframe {
      width: 390px; height: 200%;
      transform-origin: 0 0;
      transform: scale(var(--split-scale, 0.47));
    }
  }
</style>
</head>
<body data-mobile="new">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        配色对比
        <span class="swatches" aria-hidden="true">
          <i style="background:#f995bb"></i>
          <i style="background:#eb665e"></i>
          <i style="background:#f6d25a"></i>
          <i style="background:#5c96e0"></i>
        </span>
      </div>
      <div class="controls">
        <div class="modes mobile-only" id="modes">
          <button type="button" class="btn old" data-mode="old">原版绿</button>
          <button type="button" class="btn new on" data-mode="new">结束乐队</button>
          <button type="button" class="btn" data-mode="split">并排</button>
        </div>
        <div class="tabs" id="tabs">
          <button type="button" class="btn on" data-hash="#now">总览</button>
          <button type="button" class="btn" data-hash="#day/2026-12-02">12/2 行程</button>
          <button type="button" class="btn" data-hash="#shots/2026-12-02">12/2 巡礼</button>
          <button type="button" class="btn" data-hash="#prep">准备</button>
        </div>
        <button type="button" class="btn" id="scheme-btn" aria-label="切换日间或夜间">夜间</button>
      </div>
    </div>
  </header>

  <main class="stage">
    <section class="col old">
      <div class="label"><span class="tag old">当前</span><span class="desc">和纸米白 · 常磐绿 & 梅紫</span></div>
      <div class="phone"><iframe id="f-old" src="../index.html#now" title="当前和纸绿"></iframe></div>
    </section>
    <section class="col new">
      <div class="label"><span class="tag new">结束乐队</span><span class="desc">纯白和纸 · 四色柔光微炫边</span></div>
      <div class="phone"><iframe id="f-new" src="../index.html#now" title="结束乐队白底四色"></iframe></div>
    </section>
  </main>

  <script>
    const PASTEL4_CSS = `
:root[data-palette='pastel4'] {
  --bocchi: #e04e84; --bocchi-l: #f995bb; --bocchi-soft: #fdf0f5;
  --kita: #d63b38;   --kita-l: #eb665e;   --kita-soft: #fdeeed;
  --nijika: #9a6700; --nijika-l: #f6d25a; --nijika-soft: #fef7dc;
  --ryo: #2e61ad;    --ryo-l: #5c96e0;    --ryo-soft: #edf4fd;

  --paper: #fafafd; --card: #ffffff; --sunk: #f2f4f9;
  --ink: #1e212a; --ink-2: #464c5c; --muted: #697184;
  --line: #e6e9f2; --line-2: #9ba3b5;

  --accent: var(--ryo); --accent-fill: var(--ryo-l); --accent-pale: #dceafb; --nav-fill: #cde2fa;
  --accent-ink: #153563; --tab-on-ink: #1c4782; --accent-soft: var(--ryo-soft); --fill-edge: rgba(46,97,173,.16);
  --moegi: var(--ryo-l); --plum: var(--bocchi); --plum-soft: rgba(224,78,132,.09); --gold: var(--nijika-l);
  --shu: var(--kita); --shu-soft: rgba(214,59,56,.08);
  --danger: #cc3330; --danger-soft: var(--kita-soft);
  --warn: var(--nijika); --warn-soft: var(--nijika-soft);
  --ok: var(--ryo); --ok-soft: var(--ryo-soft);

  --wash-shu: rgba(235,102,94,.22); --wash-moegi: rgba(246,210,90,.32); --wash-plum: rgba(249,149,187,.28);
  --wash-gold: rgba(246,210,90,.38); --wash-accent: rgba(92,150,224,.20);
  --tape-a: rgba(246,210,90,.48); --tape-b: rgba(249,149,187,.44);
  --glow: transparent; --lattice: rgba(92,150,224,.045);
  --press: rgba(60,111,184,.34);
  --shadow: 0 2px 6px rgba(34,42,68,.04), 0 10px 26px -14px rgba(46,97,173,.14);
  --lift: 0 3px 8px rgba(34,42,68,.05), 0 18px 38px -14px rgba(46,97,173,.18);
  --toast-bg: #1e212a; --toast-ink: #ffffff; --toast-action: #f995bb;
  --kessoku-rim: linear-gradient(135deg, rgba(246,210,90,.62), rgba(92,150,224,.46) 36%, rgba(249,149,187,.62) 70%, rgba(235,102,94,.46));
  --kessoku-line: linear-gradient(90deg, #f6d25a, #eb665e 34%, #f995bb 68%, #5c96e0);
}
:root[data-palette='pastel4'] body {
  background:
    radial-gradient(58% 32% at 0% 0%, rgba(246,210,90,.28), transparent 72%) fixed,
    radial-gradient(56% 32% at 100% 2%, rgba(92,150,224,.22), transparent 72%) fixed,
    radial-gradient(54% 30% at 0% 96%, rgba(235,102,94,.18), transparent 72%) fixed,
    radial-gradient(60% 34% at 100% 100%, rgba(249,149,187,.28), transparent 72%) fixed,
    var(--paper);
}
:root[data-palette='pastel4'] .block,
:root[data-palette='pastel4'] .shot,
:root[data-palette='pastel4'] .focus,
:root[data-palette='pastel4'] .day-ticket,
:root[data-palette='pastel4'] .link-row {
  background:
    linear-gradient(var(--card), var(--card)) padding-box,
    var(--kessoku-rim) border-box;
  border: 1px solid transparent;
}
:root[data-palette='pastel4'] .focus.live {
  box-shadow: 0 0 0 2px rgba(92,150,224,.45), var(--lift);
}
:root[data-palette='pastel4'] .tabbar {
  background: color-mix(in srgb, var(--card) 92%, transparent);
  box-shadow: 0 -1px 0 rgba(230,233,242,.7);
}
:root[data-palette='pastel4'] .tabbar::before {
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1.5px;
  background: var(--kessoku-line); opacity: .78; pointer-events: none;
}
:root[data-palette='pastel4'] .bar i { background: var(--kessoku-line); }
:root[data-palette='pastel4'] .tab:nth-child(1).on { background: var(--kita-soft); color: var(--kita); }
:root[data-palette='pastel4'] .tab:nth-child(1).on::before { background: var(--kita-l); }
:root[data-palette='pastel4'] .tab:nth-child(2).on { background: var(--ryo-soft); color: var(--ryo); }
:root[data-palette='pastel4'] .tab:nth-child(2).on::before { background: var(--ryo-l); }
:root[data-palette='pastel4'] .tab:nth-child(3).on { background: var(--bocchi-soft); color: var(--bocchi); }
:root[data-palette='pastel4'] .tab:nth-child(3).on::before { background: var(--bocchi-l); }
:root[data-palette='pastel4'] .tab:nth-child(4).on { background: var(--nijika-soft); color: var(--nijika); }
:root[data-palette='pastel4'] .tab:nth-child(4).on::before { background: var(--nijika-l); }
:root[data-palette='pastel4'] .flag:not(.warn) { color: var(--bocchi); }
:root[data-palette='pastel4'] .shot-note b { color: var(--bocchi); }
:root[data-palette='pastel4'] .shot-img { background: #ffffff; }
:root[data-palette='pastel4'] .pair .shot-img:nth-child(1)::before {
  background: repeating-linear-gradient(135deg, rgba(246,210,90,.55) 0 5px, rgba(235,102,94,.42) 5px 10px);
}
:root[data-palette='pastel4'] .pair .shot-img:nth-child(2)::before {
  background: repeating-linear-gradient(45deg, rgba(92,150,224,.48) 0 5px, rgba(249,149,187,.52) 5px 10px);
}
:root[data-palette='pastel4'] .day-key::before {
  background: linear-gradient(180deg, #f6d25a, #eb665e, #f995bb, #5c96e0);
}
:root[data-palette='pastel4'] .strip-day.on {
  background: linear-gradient(135deg, #edf4fd, #fdf0f5);
  color: var(--ryo);
  box-shadow: inset 0 0 0 1px rgba(92,150,224,.35);
}
:root[data-palette='pastel4'] .strip-day.on small { color: var(--bocchi); opacity: .95; }
:root[data-palette='pastel4'][data-user-color-scheme='dark'] {
  --bocchi: #ff9ec2; --bocchi-l: #ff9ec2; --bocchi-soft: rgba(255,158,194,.14);
  --kita: #ff7e75;   --kita-l: #ff7e75;   --kita-soft: rgba(255,126,117,.14);
  --nijika: #f8d86c; --nijika-l: #f8d86c; --nijika-soft: rgba(248,216,108,.14);
  --ryo: #8cc2ff;    --ryo-l: #8cc2ff;    --ryo-soft: rgba(140,194,255,.15);

  --paper: #0e1017; --card: #151822; --sunk: #1d2230;
  --ink: #eef1f8; --ink-2: #c5ccdb; --muted: #939cb0;
  --line: #262c3d; --line-2: #5b657d;

  --accent: var(--ryo); --accent-fill: var(--ryo); --accent-pale: var(--ryo); --nav-fill: var(--ryo);
  --accent-ink: #0e1c30; --tab-on-ink: #c7e0ff; --accent-soft: var(--ryo-soft); --fill-edge: transparent;
  --moegi: var(--ryo); --plum: var(--bocchi); --plum-soft: var(--bocchi-soft); --gold: var(--nijika);
  --shu: var(--kita); --shu-soft: var(--kita-soft);
  --danger: #ff867e; --danger-soft: var(--kita-soft);
  --warn: var(--nijika); --warn-soft: var(--nijika-soft);
  --ok: var(--ryo); --ok-soft: var(--ryo-soft);
  --wash-shu: rgba(255,126,117,.28); --wash-moegi: rgba(248,216,108,.24); --wash-plum: rgba(255,158,194,.24);
  --wash-gold: rgba(248,216,108,.28); --wash-accent: rgba(140,194,255,.18);
  --lattice: rgba(140,194,255,.04);
  --toast-bg: #eef1f8; --toast-ink: #151822; --toast-action: #2e61ad;
  --kessoku-rim: linear-gradient(135deg, rgba(248,216,108,.36), rgba(140,194,255,.32) 36%, rgba(255,158,194,.36) 70%, rgba(255,126,117,.30));
}
:root[data-palette='pastel4'][data-user-color-scheme='dark'] body {
  background:
    radial-gradient(58% 32% at 0% 0%, rgba(248,216,108,.11), transparent 72%) fixed,
    radial-gradient(56% 32% at 100% 2%, rgba(140,194,255,.12), transparent 72%) fixed,
    radial-gradient(54% 30% at 0% 96%, rgba(255,126,117,.10), transparent 72%) fixed,
    radial-gradient(60% 34% at 100% 100%, rgba(255,158,194,.12), transparent 72%) fixed,
    var(--paper);
}
:root[data-palette='pastel4'][data-user-color-scheme='dark'] .strip-day.on {
  background: linear-gradient(135deg, rgba(140,194,255,.22), rgba(255,158,194,.20));
  color: #eef1f8;
  box-shadow: inset 0 0 0 1px rgba(140,194,255,.35);
}
:root[data-palette='pastel4'][data-user-color-scheme='dark'] .strip-day.on small { color: var(--bocchi); }`;

    const fOld = document.getElementById('f-old'), fNew = document.getElementById('f-new');
    let scheme = 'light';

    function styleNewFrame() {
      try {
        const doc = fNew.contentDocument;
        if (!doc || !doc.head) return;
        if (!doc.getElementById('pastel4-style')) {
          const st = doc.createElement('style');
          st.id = 'pastel4-style';
          st.textContent = PASTEL4_CSS;
          doc.head.appendChild(st);
        }
        doc.documentElement.setAttribute('data-palette', 'pastel4');
        doc.documentElement.setAttribute('data-user-color-scheme', scheme);
      } catch (e) {}
    }
    function styleOldFrame() {
      try {
        const doc = fOld.contentDocument;
        if (!doc || !doc.documentElement) return;
        doc.documentElement.removeAttribute('data-palette');
        doc.documentElement.setAttribute('data-user-color-scheme', scheme);
      } catch (e) {}
    }

    fNew.addEventListener('load', styleNewFrame);
    fOld.addEventListener('load', styleOldFrame);
    styleNewFrame();
    styleOldFrame();

    document.getElementById('tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-hash]');
      if (!btn) return;
      document.querySelectorAll('#tabs .btn').forEach(b => b.classList.toggle('on', b === btn));
      const h = btn.dataset.hash;
      try { fOld.contentWindow.location.hash = h; fNew.contentWindow.location.hash = h; }
      catch { fOld.src = '../index.html' + h; fNew.src = '../index.html' + h; }
    });

    document.getElementById('modes').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-mode]');
      if (!btn) return;
      document.querySelectorAll('#modes .btn').forEach(b => b.classList.toggle('on', b === btn));
      document.body.setAttribute('data-mobile', btn.dataset.mode);
      updateSplitScale();
    });

    const schemeBtn = document.getElementById('scheme-btn');
    schemeBtn.addEventListener('click', () => {
      scheme = scheme === 'light' ? 'dark' : 'light';
      schemeBtn.textContent = scheme === 'dark' ? '日间' : '夜间';
      schemeBtn.classList.toggle('on', scheme === 'dark');
      styleOldFrame();
      styleNewFrame();
    });

    function updateSplitScale() {
      if (window.innerWidth > 840) return;
      const phoneW = (window.innerWidth - 18) / 2 - 4;
      const scale = Math.max(0.35, Math.min(1, phoneW / 390));
      document.documentElement.style.setProperty('--split-scale', scale.toFixed(4));
      const phones = document.querySelectorAll('.phone iframe');
      phones.forEach(fr => {
        if (document.body.getAttribute('data-mobile') === 'split') {
          fr.style.height = Math.round(100 / scale) + '%';
        } else {
          fr.style.height = '100%';
        }
      });
    }
    window.addEventListener('resize', updateSplitScale);
    updateSplitScale();
  </script>
</body>
</html>
